# nginx site config for the production UI (copied into the image by docker/frontend.Dockerfile).
#
#   /            the built React files (and index.html for every unknown path: SPA fallback)
#   /api/...     forwarded to the API container, with buffering OFF so streamed answers
#                reach the browser word by word instead of all at once at the end
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off; # don't advertise the nginx version

    # Uploads: matches the API's own limits (MAX_UPLOAD_MB=25 x MAX_UPLOAD_FILES=20). The API
    # still checks each file; this only stops nginx rejecting a request the API would accept.
    client_max_body_size 500m;

    # Security headers ("always" = also on error responses).
    # CSP: the page may only load scripts, styles, images and API calls from this same site,
    # so injected content (e.g. from a model answer) can't pull in anything from elsewhere.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker's internal DNS. Looking the API up per request (via the variable below) means
    # nginx keeps working if the API container restarts and gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming (Server-Sent Events): pass every piece on immediately.
        proxy_buffering off;
        proxy_cache off;
        # An answer can take ~30 s and a big repo ingest request a while: don't cut them off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Built JS/CSS files have a content hash in their names, so they can be cached for a year.
    location /assets/ {
        expires 1y;
    }

    # index.html must never be cached, so a new deploy is picked up on the next reload.
    location = /index.html {
        expires -1;
    }

    # Single-page app: /anything that isn't a file gets index.html, and React takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
