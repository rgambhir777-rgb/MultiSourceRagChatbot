# nginx site config for the Modal deployment (copied into the image by docker/modal.Dockerfile).
#
# Same job as frontend/nginx.conf (serve the React files, forward /api with buffering off), with
# three differences, because on Modal the API and nginx share ONE container:
#   - nginx listens on 8080 (the port Modal exposes) and forwards to the API at 127.0.0.1:8000;
#   - no Docker DNS resolver (there is no Docker network on Modal);
#   - every request needs a username + password (HTTP basic auth). The site is on the public
#     internet and each question costs OpenAI money, so strangers must not be able to use it.
#     The password file is written at start-up from a Modal Secret (deploy/start_web.py).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    auth_basic "MultiSource RAG Chat";
    auth_basic_user_file /etc/nginx/ragbot.htpasswd;

    client_max_body_size 500m; # = MAX_UPLOAD_MB (25) x MAX_UPLOAD_FILES (20), as in frontend/nginx.conf

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HTTPS only: Modal serves the site over https, so tell browsers never to use plain http.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The API doesn't need the password; don't pass it on.
        proxy_set_header Authorization "";

        proxy_buffering off; # streamed answers (SSE) word by word
        proxy_cache off;
        proxy_read_timeout 300s; # Modal itself ends any request after 150 s
        proxy_send_timeout 300s;
    }

    # Health checks (behind the password like everything else): /ready shows whether Qdrant,
    # Postgres and OpenAI are reachable from Modal.
    location ~ ^/(health|ready)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Authorization "";
    }

    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
